<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 120" role="img" aria-label="Snake animation">
  <defs>
    <linearGradient id="snakeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <style>
      .snake-body {
        fill: none;
        stroke: url(#snakeGradient);
        stroke-width: 14;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 18 12;
        animation: moveTail 0.9s linear infinite;
      }
      .snake-head {
        fill: #16a34a;
      }
      .snake-eye {
        fill: #ffffff;
      }
      @keyframes moveTail {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 30; }
      }
    </style>
  </defs>
  <path class="snake-body" d="M 30 75 C 120 10 200 120 280 65 S 460 40 550 75"/>
  <g class="snake-head">
    <circle cx="0" cy="0" r="10"/>
    <circle class="snake-eye" cx="4" cy="-4" r="2.5"/>
    <animateMotion dur="2.3s" repeatCount="indefinite" rotate="auto" path="M 30 75 C 120 10 200 120 280 65 S 460 40 550 75"/>
  </g>
</svg>
